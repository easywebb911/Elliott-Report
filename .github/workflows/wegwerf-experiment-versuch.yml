# WEGWERF-EXPERIMENT — TEMPORÄR
#
# Zweiter Teil des Feasibility-Tests: versucht, den Ziel-Workflow
# (wegwerf-experiment-ziel.yml) per workflow_dispatch/GitHub-API automatisch
# auszulösen — NUR mit dem ohnehin vorhandenen Standard-GITHUB_TOKEN, keine
# neuen Secrets/PATs/Apps. Die `permissions: actions: write`-Zeile unten
# vergibt kein neues externes Credential, sondern grenzt nur die Actions-
# Berechtigung des bereits vorhandenen Standard-Tokens für DIESEN einen
# Workflow-Lauf ein (weiterhin gedeckelt durch die Repo-Einstellung
# Settings → Actions → General → Workflow permissions) — mit Easy
# ausdrücklich als "noch Standard-Setup" abgestimmt (25.08.2026).
#
# Fragt zusätzlich den repo-weiten Berechtigungs-Deckel selbst ab
# (GET .../actions/permissions/workflow), damit das Testergebnis nicht nur
# behauptet, sondern durch die eigene, selbst geloggte API-Antwort belegt ist.
#
# Wird nach Abschluss des Tests vollständig entfernt.
name: "WEGWERF-EXPERIMENT — TEMPORÄR: Auto-Dispatch-Versuch"

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  versuch:
    runs-on: ubuntu-latest
    steps:
      - name: Repo-Berechtigungsdeckel für den Standard-Token abfragen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== GET /repos/${{ github.repository }}/actions/permissions/workflow =="
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/permissions/workflow"

      - name: Ziel-Workflow per workflow_dispatch auslösen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== POST /repos/${{ github.repository }}/actions/workflows/wegwerf-experiment-ziel.yml/dispatches =="
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/wegwerf-experiment-ziel.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
