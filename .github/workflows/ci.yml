name: CI

# Grüner Haken je PR + bei Push auf main. Führt die Offline-Tests aus —
# KEIN Netz-/yfinance-Zugriff nötig (Tests nutzen synthetische Daten).

on:
  pull_request:
  push:
    branches: [main]
  # Handover-Sync-Bot (handover_sync.yml): seine PRs bekommen den
  # pull_request-Lauf nur "zur Freigabe" (action_required, 0 Jobs). Der Bot
  # startet deshalb diesen Workflow per workflow_dispatch auf seinem Branch;
  # der Job "test" erzeugt dann den Check-Run "test" auf dem Head-Commit.
  workflow_dispatch:
    inputs:
      ref:
        description: "Erwarteter Head-Commit (SHA) des Branches. Weicht der Branch ab, bricht der Lauf ab."
        required: false
        default: ""

permissions:
  contents: read

# Ältere Läufe je Ref abbrechen, wenn neu gepusht wird.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Nur bei workflow_dispatch: der Lauf muss genau den Commit testen, für
      # den er gestartet wurde — sonst stünde ein Check auf dem falschen Kopf.
      - name: Head-Commit prüfen (nur workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.ref != ''
        env:
          ERWARTET: ${{ inputs.ref }}
          IST: ${{ github.sha }}
        run: |
          if [ "$ERWARTET" != "$IST" ]; then
            echo "::error::Branch steht auf $IST, erwartet war $ERWARTET — Abbruch."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # VOLLE Historie (Default wäre fetch-depth: 1, ein flacher Klon).
          # tests/test_episoden_split_marker.py fährt einen Replay über die
          # committeten Stände von data/forward_collection.json — der forensische
          # Beweis, welche Episoden der Mehrfach-Lauf-Defekt zerschnitten hat
          # (01.08.2026). Flach geklont findet `git log` genau EINEN Stand, der
          # Replay liefert nichts und die Beweise wären still leer. Die Tests
          # überspringen sich in einem flachen Klon ausdrücklich (mit Grund),
          # damit das nie unbemerkt passiert; hier sollen sie WIRKLICH laufen.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip  # pip-Cache über requirements.txt -> schnelle Re-Runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (offline)
        run: python -m pytest -q
