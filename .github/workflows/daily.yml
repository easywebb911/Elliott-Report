name: Daily Elliott Report

# Läuft nach US-Börsenschluss (22:45 UTC) + manuell per Tap (workflow_dispatch).
# Committet data/report.json (+ Spiegel) UND data/forward_collection.json
# (+ Spiegel) auf main — die Forward-Sammlung MUSS persistiert werden, sonst
# resettet sie jeden Lauf und n wächst nie (siehe SESSION_HANDOVER.md).
# Fail-soft: Ein fehlerhafter Lauf committet nichts, bricht aber sichtbar ab,
# statt kaputte Daten zu veröffentlichen.
#
# CRON-VERSCHIEBUNG 22.08.2026 (21:45 -> 22:45 UTC, eine Stunde später):
# die Sonden-Rohdaten (data/source_timing_probe.jsonl, #97) zeigen einen
# DE-Rückzug (last_bar_date fällt bei einem späteren Lauf desselben Tages auf
# ein früheres Datum zurück) an 5 von 10 Tagen, jeweils zwischen dem 4. und 5.
# Tageslauf — deckt sich mit dem Live-Vorfall vom 21./22.08.2026
# ("DE: Kurse 1 Handelstag zurück — erwartet 2026-08-20, tatsächlich
# 2026-08-19"). Erster vollständiger Tagesbar-Datenpunkt (10/10 Ticker) für
# BEIDE Märkte in den Rohdaten: Min 19:36, Median 19:54, Max 20:04 UTC — eine
# Stunde Verschiebung liegt selbst mit dem größten gemessenen Startverzug
# (~54 Min., Woche 1) sicher danach. Trade-off: Karten erscheinen künftig ca.
# eine Stunde später am Abend, dafür entfallen die DE-Rückzugs-Fehlwarnungen
# im health_check. Reine Zeitverschiebung, keine Retry-/Wartelogik.

on:
  schedule:
    # Nur Werktage (Mo–Fr) 22:45 UTC — Sa/So gibt es keine neuen Tageskerzen.
    # Gemeinsame Feiertage (NYSE ∩ Xetra) fängt das Gate in der Pipeline ab
    # (scripts/market_calendar.py); der Staleness-Wächter kennt denselben
    # Kalender → keine Wochenend-/Feiertags-Fehlalarme.
    - cron: "45 22 * * 1-5"
  workflow_dispatch:          # Tap-Start (auch am Wochenende möglich)
    inputs:
      push_selftest:
        description: "Einen Bestätigungs-Push senden (prüft die ntfy-Verdrahtung)"
        type: boolean
        default: false

# Nicht mehrere Läufe gleichzeitig auf main.
concurrency:
  group: daily-elliott
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # DEN ZWEIG auschecken, nicht den beim Auslösen eingefrorenen SHA
        # (31.07.2026, Lauf 30626433741). Ohne `ref` nimmt actions/checkout
        # `github.sha` — und der steht schon fest, wenn der Lauf in der
        # concurrency-Warteschlange steht. Ein wartender Lauf rechnete deshalb
        # auf dem ALTEN Stand, und sein `git pull --rebase` kollidierte
        # anschliessend mit dem Daten-Commit des Laufs davor.
        #
        # Die Warteschlange allein reicht also nicht: sie serialisiert die
        # Läufe korrekt (belegt: der zweite Job wurde EINE Sekunde nach dem
        # Ende des ersten angelegt), aber sie aktualisiert den Stand nicht.
        #
        # `github.ref_name` statt hart "main": ein Dispatch von einem
        # Feature-Branch (Push-Verdrahtungstest) bleibt auf SEINEM Branch.
        #
        # BEWUSSTE FOLGE: ein Lauf führt ab jetzt den AKTUELLEN Zweig-Stand
        # aus, der neuer sein kann als der auslösende Commit (Registry-Notiz
        # vom 31.07.). Genau das ist gewollt — der Report wird ohnehin bei
        # jedem Lauf neu erzeugt.
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        id: pipeline
        env:
          # Agent-Kommentar v1 (rein additiv). Fehlt das Secret, ist der Schritt
          # ein no-op — der Lauf verhält sich exakt wie vorher.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # ntfy-Topic — MUSS hier stehen (Fund 27.07.2026): GitHub Actions
          # vererbt Secrets NICHT in Steps. Die Pipeline selbst pusht an ZWEI
          # Stellen (Score-Alert #24 via notify.send_score_alert, Health-Check
          # Stufe 2 via health_check.run) und liest beide Male
          # os.environ["NTFY_TOPIC"]. Ohne dieses Mapping war der Wert leer und
          # beide Zweige waren still — fail-soft, also ohne jede Fehlermeldung.
          # Die anderen Push-Stellen (notify.py --mode daily, Fehlschlag-curl,
          # staleness_check.yml) hatten das Mapping von Anfang an.
          # Regressionsnetz: tests/test_workflow_push_wiring.py.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/elliott_pipeline.py

      - name: Validate report JSON
        id: validate
        run: |
          python - <<'PY'
          import json, sys

          # STRIKT gegen NaN/Infinity (ab 27.07.2026, Health-Check Stufe 2):
          # json.dump schreibt float('nan') als literales `NaN` — das ist KEIN
          # gültiges JSON. Python liest es klaglos zurück (deshalb lief diese
          # Prüfung bisher durch), aber JSON.parse im Browser WIRFT → die PWA
          # lädt gar nicht mehr. Lieber hier laut scheitern (nichts wird
          # committet, der letzte gute Report bleibt stehen und das Frontend
          # zeigt den Staleness-Hinweis) als kaputte Daten veröffentlichen.
          def _reject(const):
              raise ValueError(f"nicht-endliche Zahl im Report: {const}")

          for path in ("data/report.json", "docs/data/report.json"):
              with open(path, encoding="utf-8") as fh:
                  data = json.load(fh, parse_constant=_reject)
              assert "markets" in data and "US" in data["markets"] and "DE" in data["markets"], path
              assert "run_timestamp_utc" in data, path
          print("report JSON valide (inkl. Finit-Prüfung)")
          PY

      # Selbstüberwachung (bewusst fast stumm): Meilenstein n>=100 + Review-
      # Wecker. VOR dem Commit, damit die einmalige Meilenstein-Marker-Datei im
      # selben Lauf mitcommittet wird. notify.py ist total fail-soft (exit 0).
      - name: Self-monitor push (Meilenstein + Review-Wecker)
        if: success()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/notify.py --mode daily

      # Bestätigungs-Push (nur auf ausdrücklichen Schalter, nie automatisch).
      # Beweist Ende zu Ende, dass das Topic im Prozess ankommt — dieselbe
      # Mechanik, die Score-Alert und Health-Check nutzen. Fail-soft wie alles
      # andere: exit 0, egal was ntfy antwortet.
      - name: Push-Verdrahtung testen (manuell)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_selftest }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          # Diagnose OHNE Leak: nur ob gesetzt und wie lang — nie der Wert.
          # (Ein leeres Secret sieht sonst exakt aus wie ein fehlendes Mapping;
          # dieser Unterschied hat am 27.07. eine Stunde gekostet.)
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::warning::secrets.NTFY_TOPIC ist im Job LEER — Secret fehlt,
            heisst anders, oder wurde erst nach Job-Start angelegt."
          else
            echo "secrets.NTFY_TOPIC ist gesetzt (Laenge ${#NTFY_TOPIC})."
          fi
          python scripts/notify.py --mode selftest

      # NUR auf main committen. Ein Dispatch von einem Feature-Branch (z. B. um
      # die Push-Verdrahtung zu testen) soll den Lauf nicht rot faerben: dort
      # laeuft `git pull --rebase origin main` zwangslaeufig in einen Konflikt
      # mit den Datenfiles, und der daraus folgende Fehlschlag-Push ist ein
      # reiner Fehlalarm (beobachtet am 27.07., Run 30304607999).
      - name: Commit report + collection if changed
        id: commit
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Report UND Forward-Sammlung persistieren (sonst wächst n nie).
          git add data/report.json docs/data/report.json \
                  data/forward_collection.json docs/data/forward_collection.json
          # Einmaliger Meilenstein-Marker (falls in diesem Lauf gesetzt).
          [ -f data/validation_milestone_fired.flag ] \
            && git add data/validation_milestone_fired.flag || true
          # Flanken-Marker des Health-Checks (Stufe 2). MUSS persistiert werden,
          # sonst ist jeder Lauf eine neue Flanke -> Push-Wiederholung bei
          # unverändertem Zustand (genau das, was die Flanken-Logik verhindert).
          [ -f data/health_state.json ] && git add data/health_state.json || true
          if git diff --cached --quiet; then
            echo "Keine Änderungen — nichts zu committen."
          else
            git commit -m "chore(data): täglicher Elliott-Report + Sammlung [skip ci]"
            # Race-Härtung: falls main während des Laufs wanderte (z. B. ein
            # Feature-PR gemergt), unseren Daten-Commit darauf rebasen und
            # pushen. Datenfiles kollidieren praktisch nie (nur dieser Job
            # schreibt sie; Läufe sind per concurrency serialisiert). Bei
            # echtem Konflikt bricht der Rebase ab -> Lauf schlägt sichtbar
            # fehl (fail-soft: kein Teil-Push).
            pushed=""
            for i in 1 2 3; do
              # Einen haengengebliebenen Rebase ZUERST aufloesen. Ohne das
              # waren Versuche 2 und 3 keine Versuche: der erste Konflikt
              # laesst den Arbeitsbaum mit unmerged files stehen, und jeder
              # weitere `git pull` bricht sofort mit "Pulling is not possible
              # because you have unmerged files" ab (beobachtet 31.07.2026,
              # Lauf 30626433741). Beim ersten Durchgang ist es ein no-op.
              git rebase --abort >/dev/null 2>&1 || true
              if git pull --rebase origin main && git push; then
                pushed="yes"; break
              fi
              echo "Push-Versuch $i fehlgeschlagen — neuer Versuch."
              sleep $((i * 3))
            done
            git rebase --abort >/dev/null 2>&1 || true
            if [ -z "$pushed" ]; then
              echo "::error::Daten-Push nach 3 Versuchen fehlgeschlagen."
              exit 1
            fi
          fi

      # Lauf-Fehlschlag → EIN Push. Bewusst inline (curl), damit ein gebrochener
      # Python-/Pip-Schritt den Alarm nicht mitreißt. Fail-soft: leeres Topic
      # oder curl-Fehler ändern den (bereits roten) Job-Status nicht.
      - name: Push bei Lauf-Fehlschlag
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Schritt-Ergebnisse als Klartext — die Fallunterscheidung passiert
          # in der Shell, damit es EIN curl-Aufruf bleibt.
          PIPELINE: ${{ steps.pipeline.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "kein NTFY_TOPIC → kein Push (graceful)."; exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          HEUTE="$(date -u +%Y-%m-%d)"
          # ZWEI verschiedene Lagen, zwei verschiedene Texte (31.07.2026):
          #   (1) Analyse fehlerfrei, NUR der Daten-Push scheiterte -> die
          #       Zahlen stimmen, sie kommen im naechsten Lauf. Kein Notfall,
          #       also keine Sirene und Prioritaet "default".
          #   (2) Alles andere -> echter Ausfall, unveraendert "high" + Sirene.
          # Ohne diese Trennung sah ein reiner Push-Konflikt aus wie ein
          # kaputter Lauf — und ein Alarm, der dreimal ohne Anlass kommt,
          # wird beim vierten Mal ignoriert.
          if [ "$PIPELINE" = "success" ] && [ "$VALIDATE" = "success" ] \
             && [ "$COMMIT" = "failure" ]; then
            TITEL="Elliott: Daten-Push-Konflikt"
            PRIO="default"
            TAGS="information_source"
            TEXT="Daten-Push-Konflikt · ${HEUTE} · Analyse lief fehlerfrei, Daten kommen im nächsten Lauf · ${RUN_URL}"
          else
            TITEL="Elliott-Lauf fehlgeschlagen"
            PRIO="high"
            TAGS="rotating_light"
            TEXT="Elliott-Lauf fehlgeschlagen · ${HEUTE} · ${RUN_URL}"
          fi
          curl -s -m 10 \
            -H "Title: ${TITEL}" \
            -H "Priority: ${PRIO}" -H "Tags: ${TAGS}" \
            -d "${TEXT}" \
            "https://ntfy.sh/${NTFY_TOPIC}" || echo "ntfy-Push fehlgeschlagen (fail-soft)"
          exit 0
