# Sekundäre Erfolgsregel "nicht invalidiert" (Easy-Entscheid, Variante A,
# #176/#177) mit echter Zufalls-Baseline — in EINEM Runner-Lauf: Kursbasis
# holen UND auswerten, Ergebnis NUR in der Job-Zusammenfassung.
#
# ANLASS: `evaluate_nicht_invalidiert.py` lief bisher in dieser Code-Sitzung,
# die Yahoo Finance nicht erreicht (Proxy-Sperre) — die Baseline blieb
# "nicht durchführbar". Der GitHub-Runner erreicht Yahoo direkt (wie
# `eval_prices.yml` es seit dem 30.07.2026 tut). KEIN Artefakt-Umweg nötig:
# `--kurse-holen` schreibt hier auf denselben Default-Pfad
# (`data/eval_prices.json`), den `evaluate_nicht_invalidiert.py` ohnehin
# als Default liest — beide Skripte laufen im selben Checkout, derselbe
# Lauf.
#
# NUR MANUELL. Absichtlich kein `schedule`, kein `push`, kein `workflow_run`
# — Muster 1:1 aus `eval_prices.yml` übernommen, nicht neu erfunden.
#
# NICHTS WIRD COMMITTET. Weder die Kursbasis (`data/eval_prices.json`, seit
# PR #177 auch per `.gitignore` geschützt) noch sonst etwas — das Ergebnis
# lebt ausschließlich im Job-Summary dieses Laufs. Kein Merge-, Push- oder
# PR-Aufruf an keiner Stelle.
#
# HARTE GRENZEN UNBERÜHRT: `scripts/evaluate.py` (Primärwertung,
# SHA256-gepinnt in `tests/test_evaluate_nicht_invalidiert.py`), die HARTE
# SPERRE aus PR #162 (`mark_stale_market_records.py` kommt hier nirgends
# vor) — dieser Workflow ruft ausschließlich `evaluate.py --kurse-holen`
# und `evaluate_nicht_invalidiert.py` auf, beide rein lesend bis auf die
# eine gitignorierte Kursdatei.
#
# KEIN RETRY: scheitert `--kurse-holen` (Yahoo nicht erreichbar oder
# gedrosselt — in der Code-Sitzung am 11.10.2026 beobachtet, hier als
# FRAGILE ANNAHME offen: ob der Runner selbst Yahoo erreicht, ist bis zum
# ersten echten Lauf ungeprüft), bleibt der Lauf GRÜN mit einer klaren
# Zeile im Summary — kein roter Lauf aus unklarem Grund, aber auch kein
# zweiter Versuch, der Yahoo zusätzlich belasten würde.
name: "Zufalls-Baseline für 'nicht invalidiert' (manuell)"

on:
  workflow_dispatch: {}

permissions:
  contents: read        # nur lesen — dieser Lauf schreibt nichts ins Repo

concurrency:
  group: eval-nicht-invalidiert
  cancel-in-progress: false

jobs:
  auswerten:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # KEIN Retry, KEIN `continue-on-error:` (YAML-Stufe) — ein
      # Fehlschlag bleibt sichtbar, bricht aber den Lauf nicht ab: die
      # Auswertung soll auch ohne Kursbasis in der "nicht durchführbar"-
      # Variante laufen und grün bleiben.
      - name: "Schritt 1: Kursbasis holen (data/eval_prices.json, kein Retry)"
        id: kurse
        run: |
          set +e
          python scripts/evaluate.py --kurse-holen
          RC=$?
          set -e
          echo "## Kursbasis" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/eval_prices.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("data/eval_prices.json"))
          ticker = d.get("ticker", 0)
          angefragt = d.get("ticker_angefragt", 0)
          print(f"Kurse geholt: {ticker} von {angefragt} Tickern.")
          if ticker == 0:
              print()
              print("**Kursbasis fehlt (Yahoo nicht erreichbar oder "
                    "gedrosselt)** — die Auswertung läuft unten in der "
                    "'nicht durchführbar'-Variante weiter.")
          PY
          else
            echo "**Kursbasis fehlt (Yahoo nicht erreichbar oder gedrosselt, keine Datei geschrieben)** — die Auswertung läuft unten in der 'nicht durchführbar'-Variante weiter." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "kurse_rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: "Schritt 2: Auswertung mit Zufalls-Baseline (nur Summary, nichts committet)"
        run: |
          echo "## Sekundäre Erfolgsregel 'nicht invalidiert' + Verlustbild" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python scripts/evaluate_nicht_invalidiert.py >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Sicherheitsnetz: nichts wird committet. `git status --porcelain`
      # zeigt ignorierte Dateien (data/eval_prices.json, seit PR #177)
      # ohnehin nie an — die zusätzliche `--ignored`-Zeile macht das
      # explizit sichtbar, statt sich nur auf das Default-Verhalten zu
      # verlassen.
      - name: Beweis — nichts ins Repo geschrieben
        if: always()
        run: |
          git status --porcelain > /tmp/dirty
          if [ -s /tmp/dirty ]; then
            echo "::error::Dieser Lauf hat Repo-Dateien verändert:"
            cat /tmp/dirty
            exit 1
          fi
          echo "Arbeitsbaum sauber — keine Repo-Datei angefasst." >> "$GITHUB_STEP_SUMMARY"
          echo "Ignorierte Dateien (erwartet: nur data/eval_prices.json):" >> "$GITHUB_STEP_SUMMARY"
          git status --porcelain --ignored | grep '^!!' >> "$GITHUB_STEP_SUMMARY" || true
